name: Deploy

# ⚠️ MANUAL A PROPOSITO. No se despliega solo al empujar a `main`.
#
# La app calcula nomina de doce personas y corre en una maquina de 3.7 GB donde
# `next build` tarda minutos apoyandose en swap. Un despliegue automatico por
# cada commit encadenaria builds sobre una maquina que no da para dos a la vez.
#
# Cuando el equipo crezca y haya entorno de pruebas, esto puede pasar a
# automatico. Hoy la ganancia es quitar el `ssh` a mano, no quitar la decision.
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe DESPLEGAR para confirmar'
        required: true
        default: ''

# Ningun permiso por omision. El preflight solo puede leer Actions; el token
# OIDC existe exclusivamente dentro del trabajo que ya paso esa validacion.
permissions: {}

# Dos despliegues a la vez sobre la misma maquina se pisan: uno construye
# mientras el otro reinicia. Se encolan.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  validar:
    name: Validar commit y CI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read

    steps:
      - name: Comprobar confirmacion, rama y CI
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$CONFIRMAR" != "DESPLEGAR" ]; then
            echo "::error::Escribe DESPLEGAR en el campo de confirmacion."
            exit 1
          fi

          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Production solo admite la rama main; recibida: $REF"
            exit 1
          fi

          # ⚠️ **Del SHA EXACTO.** `head_sha` filtra por commit: una CI verde de
          # otro commit no aprueba este. Es la unica garantia de que lo
          # comprobado es lo que va a correr en produccion.
          echo "Esperando CI verde para $SHA..."
          ID_CORRIDA=""
          for intento in $(seq 1 80); do
            CORRIDA=$(gh api -X GET \
              "repos/$REPO/actions/workflows/ci.yml/runs" \
              -f head_sha="$SHA" \
              -f event=push \
              -f per_page=10 \
              --jq '.workflow_runs[0] // {}')

            ESTADO=$(echo "$CORRIDA" | jq -r '.status // "missing"')
            CONCLUSION=$(echo "$CORRIDA" | jq -r '.conclusion // ""')
            URL=$(echo "$CORRIDA" | jq -r '.html_url // ""')
            ID_CORRIDA=$(echo "$CORRIDA" | jq -r '.id // ""')

            if [ "$ESTADO" = "completed" ] && [ "$CONCLUSION" = "success" ]; then
              echo "CI completa: $URL"
              break
            fi

            if [ "$ESTADO" = "completed" ]; then
              echo "::error::CI termino con conclusion '$CONCLUSION': $URL"
              exit 1
            fi

            if [ "$intento" -eq 80 ]; then
              if [ "$ESTADO" = "missing" ]; then
                echo "::error::No existe ninguna ejecucion de CI para $SHA."
                echo "::error::La CI se dispara en cada push a main; revisa que el commit este empujado."
              else
                echo "::error::CI no termino en 20 minutos. Ultimo estado: $ESTADO"
              fi
              exit 1
            fi

            sleep 15
          done

          # ⚠️ **Y ahora los trabajos, uno a uno.** Que la corrida este en verde
          # no basta: si alguien anade un `if:` de mas, los trabajos caros se
          # saltan y la conclusion sigue siendo `success`. Estos tres tienen que
          # haber PASADO, no haberse saltado:
          #
          #   - «Sin secretos en el codigo» y «Workflows y scripts operativos»
          #     corren siempre y son la comprobacion de seguridad y la de los
          #     archivos que se ejecutan en produccion.
          #   - «CI» es la puerta que resume el resto y decide que combinacion
          #     de resultados es aceptable.
          echo "Comprobando los trabajos obligatorios de la corrida $ID_CORRIDA..."
          TRABAJOS=$(gh api -X GET "repos/$REPO/actions/runs/$ID_CORRIDA/jobs" -f per_page=100 \
            --jq '.jobs[] | "\(.name)=\(.conclusion // .status)"')
          echo "$TRABAJOS" | sed 's/^/  /'

          FALTA=0
          while IFS= read -r obligatorio; do
            # Coincidencia EXACTA del nombre, no por subcadena: con `grep` un
            # trabajo llamado «MI CI» aprobaria el requisito de «CI».
            RESULTADO=$(echo "$TRABAJOS" | awk -F= -v nombre="$obligatorio" '$1 == nombre { print $2; exit }')
            if [ "$RESULTADO" != "success" ]; then
              echo "::error::El trabajo '$obligatorio' no aprobo (resultado: ${RESULTADO:-ausente})."
              FALTA=1
            fi
          done <<'OBLIGATORIOS'
          Sin secretos en el codigo
          Workflows y scripts operativos
          CI
          OBLIGATORIOS

          if [ "$FALTA" -ne 0 ]; then
            echo "::error::No se despliega sin las validaciones obligatorias del commit exacto."
            exit 1
          fi

          echo "CI aprobada para $SHA."

  desplegar:
    name: Desplegar a produccion
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: validar
    permissions:
      id-token: write
      contents: read

    # El entorno registra cada despliegue y restringe la rama a main. La
    # aprobacion por revisor no esta disponible para este repo privado en Free.
    environment:
      # El nombre tiene que coincidir EXACTAMENTE con el entorno creado en
      # Settings > Environments. Si no coincide, GitHub crea uno nuevo con este
      # nombre y las aprobaciones se quedan en el que nadie mira.
      name: Production
      url: https://team.clarvex.tech

    steps:
      # ⚠️ Credenciales TEMPORALES por OIDC. No hay AWS_ACCESS_KEY_ID ni
      # AWS_SECRET_ACCESS_KEY guardados en GitHub: duran lo que dura esta
      # ejecucion y no sirven fuera de ella.
      #
      # ⚠️ Se hace A MANO y NO con `aws-actions/configure-aws-credentials`.
      # La organizacion solo permite acciones propiedad de GitHub, y esa es de
      # AWS: el flujo fallaba con «no esta permitida en CLARVEX-TEAM».
      #
      # Se podria haber permitido la accion. Se prefiere esto porque asi el
      # despliegue —lo unico que puede tocar produccion— NO ejecuta codigo de
      # terceros. El CLI de AWS ya viene en el runner y el intercambio son dos
      # llamadas.
      - name: Credenciales de AWS por OIDC
        env:
          ROL: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail

          if [ -z "${ROL:-}" ]; then
            echo "::error::Falta la variable AWS_DEPLOY_ROLE_ARN del repositorio."
            exit 1
          fi

          # 1. GitHub emite un token que dice quien soy: repositorio, rama y
          #    ejecucion. Las dos variables ACTIONS_ID_TOKEN_* solo existen si
          #    el flujo declara `permissions: id-token: write`.
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::No se pudo obtener el token de OIDC."
            exit 1
          fi

          # El SUJETO del token, que es contra lo que AWS compara la politica
          # de confianza del rol. Se imprime porque es la unica forma de saber
          # que esta mandando GitHub: un rechazo de STS dice «no autorizado»
          # y no dice contra que comparo.
          #
          # ⚠️ Se imprimen SOLO sub y aud, nunca el token. Esos dos campos
          # no son credenciales —describen quien pide, no autorizan nada— pero
          # el token entero si lo es, y quedaria escrito en un registro que
          # puede ver cualquiera con acceso al repositorio.
          CUERPO=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#CUERPO} % 4 )) in
            2) CUERPO="${CUERPO}==" ;;
            3) CUERPO="${CUERPO}=" ;;
          esac
          DATOS=$(echo "$CUERPO" | base64 -d 2>/dev/null || echo '{}')

          echo "sub del token: $(echo "$DATOS" | jq -r .sub)"
          echo "aud del token: $(echo "$DATOS" | jq -r .aud)"

          # 2. AWS lo canjea por credenciales temporales, comprobando contra la
          #    politica de confianza del rol que el repo y la rama son los que
          #    dice. Una hora como maximo.
          CRED=$(aws sts assume-role-with-web-identity \
            --role-arn "$ROL" \
            --role-session-name "clarvex-deploy-${{ github.run_id }}" \
            --web-identity-token "$TOKEN" \
            --duration-seconds 3600 \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
            --output text)

          ID=$(echo "$CRED" | cut -f1)
          SECRETO=$(echo "$CRED" | cut -f2)
          SESION=$(echo "$CRED" | cut -f3)

          # ⚠️ Enmascarar ANTES de que puedan aparecer en ningun registro. Sin
          # esto, cualquier comando que las imprima —o un error del CLI que las
          # incluya— las deja escritas en un log que puede ver quien tenga
          # acceso al repositorio.
          echo "::add-mask::$SECRETO"
          echo "::add-mask::$SESION"

          {
            echo "AWS_ACCESS_KEY_ID=$ID"
            echo "AWS_SECRET_ACCESS_KEY=$SECRETO"
            echo "AWS_SESSION_TOKEN=$SESION"
            echo "AWS_DEFAULT_REGION=us-east-1"
          } >> "$GITHUB_ENV"

          echo "Credenciales temporales obtenidas."

      - name: Lanzar el despliegue por SSM
        id: enviar
        # ⚠️ Se llega por SSM y NO por ssh a proposito: no hace falta abrir el
        # puerto 22 a los rangos de GitHub —que son enormes— ni guardar una
        # llave privada en los secretos del repositorio.
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if ! [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::SHA de despliegue invalido: $TARGET_SHA"
            exit 1
          fi

          # ⚠️ **Despliegue por VERSIONES desde el 5 de septiembre de 2026.**
          #
          # `deploy-release.sh` prepara cada version en su propio directorio y
          # activa al final, asi que un build fallido ya no desmonta lo que se
          # esta sirviendo. El corte se hizo a mano ese dia; la instalacion
          # vieja de `/home/ubuntu/clarvex-app` se conserva unos dias como
          # camino de vuelta.
          #
          # ⚠️ El guion se saca del COMMIT con `git show`, no del arbol del
          # clon. El clon de `/home/ubuntu/clarvex/repo` solo se usa para
          # `fetch` y `archive`: su arbol se queda en el commit del clonado, y
          # buscar el fichero ahi falla con «No such file or directory».
          # Comprobado en el corte.
          #
          # El propio guion vuelve a comprobar que main no haya avanzado.
          COMANDO="sudo -u ubuntu bash -lc 'cd /home/ubuntu/clarvex/repo && git fetch origin main && test \"\$(git rev-parse origin/main)\" = \"$TARGET_SHA\" && git show \"$TARGET_SHA:scripts/deploy-release.sh\" | bash -s -- \"$TARGET_SHA\"'"
          PARAMETROS=$(jq -cn --arg command "$COMANDO" '{commands:[$command]}')

          ID=$(aws ssm send-command \
            --instance-ids "${{ vars.AWS_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }} por ${{ github.actor }}" \
            --parameters "$PARAMETROS" \
            --timeout-seconds 900 \
            --query 'Command.CommandId' --output text)

          echo "comando=$ID" >> "$GITHUB_OUTPUT"
          echo "Comando SSM: $ID"

      - name: Esperar y traer la salida
        run: |
          set -uo pipefail
          ID="${{ steps.enviar.outputs.comando }}"

          # El build tarda varios minutos en esa maquina; se espera hasta 15.
          for i in $(seq 1 90); do
            ESTADO=$(aws ssm list-command-invocations \
              --command-id "$ID" --details \
              --query 'CommandInvocations[0].Status' --output text 2>/dev/null || echo "Pending")

            case "$ESTADO" in
              Success|Failed|Cancelled|TimedOut)
                break ;;
            esac
            sleep 10
          done

          echo "=== salida del servidor ==="
          aws ssm list-command-invocations --command-id "$ID" --details \
            --query 'CommandInvocations[0].CommandPlugins[0].Output' --output text

          echo "=== estado: $ESTADO ==="
          # El script de despliegue devuelve 1 si revirtio y 2 si ni la version
          # anterior levanta. Cualquiera de los dos tiene que poner el flujo en
          # rojo: un despliegue revertido NO es un despliegue correcto.
          [ "$ESTADO" = "Success" ] || exit 1

      - name: Comprobar la salud desde fuera
        # El script ya comprueba salud desde dentro de la maquina. Esto lo
        # comprueba desde INTERNET, que es por donde entra la tienda: valida
        # tambien el proxy y el certificado, no solo que Node responda.
        run: |
          set -euo pipefail
          RESPUESTA=$(curl -sf --max-time 20 https://team.clarvex.tech/api/health)
          echo "$RESPUESTA"
          echo "$RESPUESTA" | grep -q '"status":"ok"'
