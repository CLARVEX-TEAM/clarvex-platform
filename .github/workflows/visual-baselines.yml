name: Generar capturas de referencia

# Se ejecuta A MANO desde la pestaña Actions. Nunca automático.
#
# Existe porque Playwright NO escribe capturas ausentes cuando corre en CI: es
# deliberado, para que una referencia no se acepte sola sin que nadie la mire.
# Por eso el trabajo normal de regresión visual falla la primera vez y no deja
# nada que descargar.
#
# CUÁNDO USARLO:
#  - La primera vez, para crear las referencias de Linux.
#  - Cuando cambies el diseño A PROPÓSITO y el CI falle por ello. Revisa antes
#    el informe de diferencias: si el cambio no era intencionado, esto lo
#    convertiría en la nueva verdad y taparía el fallo.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baselines:
    name: Regenerar y commitear
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        env:
          AUTH_SECRET: clave-de-ci-con-al-menos-32-caracteres
          DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/none
          WEBAUTHN_RP_ID: localhost
          WEBAUTHN_RP_NAME: Clarvex Team
          WEBAUTHN_ORIGIN: http://127.0.0.1:3100
        run: pnpm run build

      - name: Generar capturas
        run: pnpm exec playwright test --update-snapshots

      - name: Commitear las nuevas referencias
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Sin cambios en las capturas: no hay nada que commitear."
            exit 0
          fi
          # [skip ci] evita que este push dispare otra vuelta de workflows.
          git commit -m "chore(visual): actualizar capturas de referencia (Linux) [skip ci]"
          git push
