name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, typecheck & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: TypeScript typecheck
        run: pnpm exec tsc --noEmit

      - name: ESLint
        run: pnpm exec eslint . --max-warnings 0

      - name: Run tests
        run: pnpm test

  visual:
    name: Regresión visual
    runs-on: ubuntu-latest
    # NO BLOQUEA mientras no existan las capturas de referencia de Linux.
    #
    # Playwright NO escribe capturas ausentes cuando corre en CI (deliberado:
    # así una referencia no se acepta sola sin que nadie la mire), de modo que
    # este trabajo falla hasta que existan.
    #
    # PARA ACTIVARLO: lanzar a mano el workflow «Generar capturas de referencia»
    # desde la pestaña Actions. Las crea y las commitea. Después, borrar la
    # línea `continue-on-error` de abajo: a partir de ahí cualquier cambio
    # visual no intencionado rompe el CI.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        # Valores de relleno: ninguna de las pantallas bajo prueba consulta la
        # base de datos, pero lib/webauthn exige sus variables en un build de
        # producción y sin ellas el build falla en "Collecting page data".
        env:
          AUTH_SECRET: clave-de-ci-con-al-menos-32-caracteres
          DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/none
          WEBAUTHN_RP_ID: localhost
          WEBAUTHN_RP_NAME: Clarvex Team
          WEBAUTHN_ORIGIN: http://127.0.0.1:3100
        run: pnpm run build

      - name: Pruebas visuales
        run: pnpm exec playwright test

      - name: Subir informe de diferencias
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-visual
          path: playwright-report/
          retention-days: 14

  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # OSV-Scanner lee pnpm-lock.yaml y lo compara contra la base OSV (Google).
      # No depende del endpoint de auditoría de npm, que fue RETIRADO (respondía
      # 410 y rompía `pnpm audit` en cada push aunque no hubiera vulnerabilidades).
      # Falla el CI si encuentra una vulnerabilidad conocida. Para ignorar una
      # puntual y justificada (con fecha de revisión), usar un osv-scanner.toml.
      - name: OSV-Scanner (vulnerabilidades en dependencias)
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=pnpm-lock.yaml
