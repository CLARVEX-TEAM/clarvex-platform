name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, typecheck & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: TypeScript typecheck
        run: pnpm exec tsc --noEmit

      - name: ESLint
        run: pnpm exec eslint . --max-warnings 0

      - name: Run tests
        run: pnpm test

  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (high + critical only)
        # `pnpm audit` sale con código de error tanto si encuentra vulnerabilidades
        # como si el endpoint de npm no responde. npm retiró el endpoint clásico
        # (responde 410), así que hay que distinguir los dos casos: una caída de
        # infraestructura NO debe tumbar el CI, pero una vulnerabilidad real SÍ.
        run: |
          set +e
          output=$(pnpm audit --audit-level=high 2>&1)
          status=$?
          echo "$output"
          if [ $status -eq 0 ]; then
            exit 0
          fi
          if echo "$output" | grep -qiE 'ERR_PNPM_AUDIT_BAD_RESPONSE|being retired|endpoint|410|ENOTFOUND|ETIMEDOUT'; then
            echo "::warning::El endpoint de auditoría de npm no respondió (lo retiraron). Se omite la auditoría en este run; revisa dependencias manualmente con 'pnpm audit' cuando npm publique el reemplazo."
            exit 0
          fi
          echo "::error::La auditoría encontró vulnerabilidades high/critical."
          exit 1
