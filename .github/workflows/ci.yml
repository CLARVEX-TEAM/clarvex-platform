name: CI

# ⚠️ **LA CI SE DISPARA SIEMPRE, y el ahorro va POR TRABAJO.**
#
# Antes se filtraba con `paths-ignore` sobre documentación y guiones de
# operación, y eso tenía dos agujeros:
#
# 1. Un commit que solo tocara esos archivos NO producía ninguna ejecución. El
#    despliegue exige CI verde del MISMO SHA, así que se quedaba veinte minutos
#    esperando una corrida que nunca iba a existir y terminaba en
#    «Ultimo estado: missing». Un despliegue imposible por un cambio inofensivo.
# 2. `scripts/**.sh` estaba en la lista, o sea que **un cambio en el propio
#    `scripts/deploy.sh` se saltaba la CI entera**, incluido el escaneo de
#    secretos. Justo el archivo que corre en producción.
#
# Ahora siempre hay ejecución. Lo que se decide por trabajo es cuál corre: el
# trabajo `cambios` mira qué se tocó y los caros —typecheck, pruebas, build con
# Chromium, auditoría de dependencias— se saltan si solo cambió documentación.
# Seguridad y validación de operativos corren SIEMPRE.
#
# ⚠️ La cuota se agotó de verdad: el 19 de agosto de 2026 GitHub empezó a
# cancelar TODAS las ejecuciones antes de arrancarlas, y los trabajos aparecían
# en rojo sin una sola línea de registro. No se facturó nada porque el límite de
# gasto estaba en cero. Por eso el ahorro se conserva; lo que cambia es dónde se
# aplica, para que nunca falte la ejecución.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permisos del token de la ejecucion, declarados AQUI y no solo en la
# organizacion.
#
# La organizacion ya los fija en READ, pero eso es un ajuste que alguien puede
# cambiar sin tocar este archivo, y que no viaja si el repositorio se copia a
# otra cuenta. Declarado aqui, el workflow se acota a si mismo pase lo que pase
# fuera.
#
# Leer el contenido es lo unico que necesita: clonar y comprobar. Ningun trabajo
# escribe en el repositorio, publica paquetes ni comenta en un PR, asi que todo
# lo demas se queda en none. Cada trabajo lo repite, para que anadir uno nuevo
# obligue a decidir sus permisos en vez de heredarlos sin mirar.
permissions:
  contents: read

# Varios pushes seguidos ya no acumulan ejecuciones: la anterior se cancela y
# solo se comprueba el último commit, que es el que va a producción.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Qué cambió ────────────────────────────────────────────────────────────
  #
  # Sustituye a `paths-ignore`. La diferencia es que la ejecución SÍ existe:
  # aquí solo se decide si vale la pena pagar los trabajos caros.
  #
  # ⚠️ Se listan EXTENSIONES concretas, no `scripts/**` entero, porque ahí viven
  # nueve archivos `.ts` --entre ellos `scripts/backup-db.ts`-- que sí son
  # código del proyecto y sí los revisa el typecheck.
  #
  # ⚠️ Y ante la duda, corre. Si el rango no se puede calcular --el primer
  # commit, un historial superficial-- se asume que hubo cambio de código. El
  # olvido se paga con una ejecución de más, nunca con una comprobación de
  # menos.
  cambios:
    name: Que cambio
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      codigo: ${{ steps.filtrar.outputs.codigo }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Decidir si cambio codigo
        id: filtrar
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          ANTES: ${{ github.event.before }}
        run: |
          set -uo pipefail

          if [ "$EVENTO" = "pull_request" ]; then
            RANGO="$BASE...HEAD"
          else
            RANGO="$ANTES..HEAD"
          fi

          ARCHIVOS=$(git diff --name-only "$RANGO" 2>/dev/null || true)

          if [ -z "$ARCHIVOS" ]; then
            echo "No se pudo calcular el rango ($RANGO). Se corre todo."
            echo "codigo=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Lo que NO obliga a compilar ni a probar.
          SOLO_DOCS=$(echo "$ARCHIVOS" | grep -vE '(\.md$|^scripts/.*\.(sh|json|yml|yaml|jq|ps1)$|^scripts/mudanza/)' || true)

          if [ -z "$SOLO_DOCS" ]; then
            echo "Solo documentacion y guiones de operacion; los trabajos caros se saltan."
            echo "codigo=false" >> "$GITHUB_OUTPUT"
          else
            echo "Hay codigo del proyecto en el cambio."
            echo "codigo=true" >> "$GITHUB_OUTPUT"
          fi

          echo "--- archivos ---"
          echo "$ARCHIVOS"

  # ── Workflows y guiones operativos ────────────────────────────────────────
  #
  # ⚠️ Corre SIEMPRE, y es justo lo que faltaba. Con `paths-ignore`, un cambio
  # en `scripts/deploy.sh` --el archivo que corre en produccion-- no pasaba por
  # ninguna comprobacion. Un error de sintaxis se descubria a mitad de un
  # despliegue.
  #
  # No sustituye a probarlos: comprueba que se PUEDEN leer, que es la clase de
  # fallo que un despliegue no deberia descubrir por su cuenta.
  operativos:
    name: Workflows y scripts operativos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Los workflows son YAML valido
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, yaml
          fallos = []
          for ruta in sorted(glob.glob(".github/workflows/*.yml")) + sorted(glob.glob(".github/workflows/*.yaml")):
              try:
                  with open(ruta, encoding="utf-8") as f:
                      datos = yaml.safe_load(f)
              except Exception as error:
                  fallos.append(f"{ruta}: {error}")
                  continue
              if not isinstance(datos, dict) or "jobs" not in datos:
                  fallos.append(f"{ruta}: no tiene bloque 'jobs'")
                  continue
              print(f"  ok {ruta} ({len(datos['jobs'])} trabajos)")
          if fallos:
              for f in fallos:
                  print(f"::error::{f}")
              sys.exit(1)
          PY

      - name: Los guiones de shell se pueden leer
        run: |
          set -euo pipefail
          FALLO=0
          while IFS= read -r guion; do
            if bash -n "$guion"; then
              echo "  ok $guion"
            else
              echo "::error::$guion no es sintacticamente valido."
              FALLO=1
            fi
          done < <(find scripts .github -name '*.sh' -type f 2>/dev/null)
          exit "$FALLO"

      - name: Los guiones de PowerShell se pueden leer
        shell: pwsh
        run: |
          $fallo = 0
          Get-ChildItem -Path scripts -Filter *.ps1 -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            $errores = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errores) | Out-Null
            if ($errores -and $errores.Count -gt 0) {
              Write-Output "::error::$($_.FullName) tiene $($errores.Count) error(es) de sintaxis."
              $fallo = 1
            } else {
              Write-Output "  ok $($_.Name)"
            }
          }
          exit $fallo

  quality:
    name: Lint, typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # ⚠️ pnpm por COREPACK, no por `pnpm/action-setup`. La organizacion solo
      # permite acciones propiedad de GitHub, y esa no lo es: con ella la CI ni
      # arrancaba --doce ejecuciones seguidas en `startup_failure`, sin una sola
      # linea de registro, que parece un fallo del codigo y no lo era--.
      #
      # Ademas es lo correcto: corepack lee `packageManager` de package.json,
      # que es la version que corre el servidor. Una sola fuente para la version
      # de pnpm, en vez de repetirla aqui y que un dia dejen de coincidir.
      - name: Activar pnpm por corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      # La cache del almacen se lleva a mano porque `cache: pnpm` de setup-node
      # exige que pnpm exista cuando esa accion corre, y aqui llega despues.
      - name: Ruta del almacen de pnpm
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache de dependencias
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: TypeScript typecheck
        run: pnpm exec tsc --noEmit

      - name: ESLint
        run: pnpm exec eslint . --max-warnings 0

      - name: Run tests
        run: pnpm test

  visual:
    name: Pantallas públicas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    # BLOQUEA, y es fiable: son comprobaciones deterministas, no comparación de
    # píxeles. Verifican que los tokens de color produzcan colores válidos, que
    # los keyframes de los efectos lleguen al CSS servido, que el fondo animado
    # no capture toques y que las pantallas públicas rendericen sin excepciones.

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # ⚠️ pnpm por COREPACK, no por `pnpm/action-setup`. La organizacion solo
      # permite acciones propiedad de GitHub, y esa no lo es: con ella la CI ni
      # arrancaba --doce ejecuciones seguidas en `startup_failure`, sin una sola
      # linea de registro, que parece un fallo del codigo y no lo era--.
      #
      # Ademas es lo correcto: corepack lee `packageManager` de package.json,
      # que es la version que corre el servidor. Una sola fuente para la version
      # de pnpm, en vez de repetirla aqui y que un dia dejen de coincidir.
      - name: Activar pnpm por corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      # La cache del almacen se lleva a mano porque `cache: pnpm` de setup-node
      # exige que pnpm exista cuando esa accion corre, y aqui llega despues.
      - name: Ruta del almacen de pnpm
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache de dependencias
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        # Valores de relleno: ninguna de las pantallas bajo prueba consulta la
        # base de datos, pero lib/webauthn exige sus variables en un build de
        # producción y sin ellas el build falla en "Collecting page data".
        env:
          AUTH_SECRET: clave-de-ci-con-al-menos-32-caracteres
          DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/none
          WEBAUTHN_RP_ID: localhost
          WEBAUTHN_RP_NAME: Clarvex Team
          WEBAUTHN_ORIGIN: http://127.0.0.1:3100
        run: pnpm run build

      - name: Comprobaciones de pantallas públicas
        run: pnpm exec playwright test

      - name: Subir informe
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: informe-playwright
          path: playwright-report/
          retention-days: 14

  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # OSV-Scanner lee pnpm-lock.yaml y lo compara contra la base OSV (Google).
      # No depende del endpoint de auditoría de npm, que fue RETIRADO (respondía
      # 410 y rompía `pnpm audit` en cada push aunque no hubiera vulnerabilidades).
      # Falla el CI si encuentra una vulnerabilidad conocida. Para ignorar una
      # puntual y justificada (con fecha de revisión), usar un osv-scanner.toml.
      - name: OSV-Scanner (vulnerabilidades en dependencias)
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=pnpm-lock.yaml

  # ⚠️ Lo que el .gitignore NO puede cazar.
  #
  # Una llave privada puede llamarse cualquier cosa —`clarvex_vultr_2026` no
  # se parece a `id_rsa` ni acaba en `.key`— asi que ninguna lista de nombres
  # la detiene. Lo que si es invariable es su CONTENIDO: toda llave PEM abre
  # con «BEGIN ... PRIVATE KEY».
  #
  # Este trabajo existe porque el proyecto ya vivio el caso caro: un dump real
  # de PostgreSQL se colo en el historial y hubo que abrir un ticket con GitHub
  # Support para purgarlo, con la migracion de repositorio detenida mientras
  # tanto. Un fichero fuera del historial se borra; uno dentro, no.
  secretos:
    name: Sin secretos en el codigo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Hacen falta los dos lados para poder comparar en un PR.
          fetch-depth: 0

      # GitHub Secret Protection no esta disponible en repos privados del plan
      # Free. TruffleHog cubre ese hueco sin otra Action de terceros: se baja
      # una version fija, se comprueba su SHA-256 y se ejecuta localmente.
      # `--no-verification` impide mandar candidatos a AWS, Slack u otros
      # proveedores para comprobar si siguen activos.
      - name: Escanear secretos con TruffleHog
        env:
          TRUFFLEHOG_VERSION: "3.97.4"
          TRUFFLEHOG_SHA256: dc24007c2f233bd61c05beabeb44aa27ea9b43288166279209abe0458c5ce76b
        run: |
          set -euo pipefail

          ARCHIVO="$RUNNER_TEMP/trufflehog.tar.gz"
          BINARIO="$RUNNER_TEMP/trufflehog"
          URL="https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"

          curl -fsSL "$URL" -o "$ARCHIVO"
          echo "$TRUFFLEHOG_SHA256  $ARCHIVO" | sha256sum --check --strict
          tar -xzf "$ARCHIVO" -C "$RUNNER_TEMP" trufflehog

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.event.after }}"
          fi

          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=""
          fi

          "$BINARIO" git "file://$GITHUB_WORKSPACE" \
            --since-commit "$BASE" \
            --branch "$HEAD" \
            --fail \
            --no-update \
            --no-verification \
            --github-actions

      - name: Buscar llaves privadas y volcados
        run: |
          set -u

          # En un PR se revisa SOLO lo que anade; en push a main, el ultimo
          # commit. Revisar el arbol entero marcaria en rojo para siempre
          # cualquier cosa que ya estuviera dentro, y el trabajo se acabaria
          # ignorando.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGO="origin/${{ github.base_ref }}...HEAD"
          else
            RANGO="HEAD~1..HEAD"
          fi

          echo "Revisando $RANGO"

          # `git diff` con -G busca en las lineas ANADIDAS o quitadas.
          SOSPECHOSOS=$(git diff --name-only -G'BEGIN [A-Z ]*PRIVATE KEY' "$RANGO" || true)

          # Y los volcados, por si entran con un nombre que el ignore no cubre.
          VOLCADOS=$(git diff --name-only --diff-filter=A "$RANGO" \
            | grep -iE '\.(dump|pgdump|sqlite|sqlite3|db)$' || true)

          if [ -n "$SOSPECHOSOS" ] || [ -n "$VOLCADOS" ]; then
            echo "::error::Se detecto material que no puede entrar al historial."
            [ -n "$SOSPECHOSOS" ] && echo "Llaves privadas en: $SOSPECHOSOS"
            [ -n "$VOLCADOS" ] && echo "Volcados de base en: $VOLCADOS"
            echo ""
            echo "Un fichero fuera del historial se borra. Uno dentro, no:"
            echo "hay que reescribir el historial y pedir a GitHub que purgue"
            echo "sus referencias internas. Sacalo del commit antes de subirlo."
            exit 1
          fi

          echo "Limpio."

  # ── La puerta ─────────────────────────────────────────────────────────────
  #
  # ⚠️ **Es lo que el despliegue exige de verdad.** Sin un trabajo que dependa
  # de todos, la conclusion de la ejecucion depende de cuales corrieron, y un
  # `if:` mal puesto podria dejar la corrida en verde sin haber comprobado
  # nada. Aqui se declara explicitamente que resultado es aceptable.
  #
  # `skipped` SI vale: es el ahorro deliberado cuando solo cambio documentacion.
  # `failure` y `cancelled` no. Se distinguen a proposito: una cancelacion no es
  # una aprobacion, y con `cancel-in-progress` las hay a menudo.
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    if: always()
    needs: [cambios, operativos, secretos, quality, visual, audit]
    steps:
      - name: Resumir el resultado
        env:
          RESULTADOS: >-
            cambios=${{ needs.cambios.result }}
            operativos=${{ needs.operativos.result }}
            secretos=${{ needs.secretos.result }}
            quality=${{ needs.quality.result }}
            visual=${{ needs.visual.result }}
            audit=${{ needs.audit.result }}
        run: |
          set -euo pipefail
          echo "$RESULTADOS" | tr ' ' '\n' | sed '/^$/d' | sed 's/^/  /'

          FALLO=0
          for par in $RESULTADOS; do
            NOMBRE="${par%%=*}"
            ESTADO="${par#*=}"
            case "$ESTADO" in
              success|skipped) ;;
              *) echo "::error::$NOMBRE termino en '$ESTADO'."; FALLO=1 ;;
            esac
          done

          # Los dos que NUNCA pueden saltarse: sin ellos no hay comprobacion de
          # seguridad ni de los archivos que corren en produccion.
          for obligatorio in operativos secretos; do
            ESTADO=$(echo "$RESULTADOS" | tr ' ' '\n' | grep "^$obligatorio=" | cut -d= -f2)
            if [ "$ESTADO" != "success" ]; then
              echo "::error::$obligatorio es obligatorio y termino en '$ESTADO'."
              FALLO=1
            fi
          done

          exit "$FALLO"
