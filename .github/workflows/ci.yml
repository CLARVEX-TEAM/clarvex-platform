name: CI

# Lo que NO dispara la CI. Un commit que solo toca documentación o guiones de
# operación no puede romper la app, y disparaba los tres trabajos —incluido el
# que instala Chromium y compila el proyecto entero—. En repo privado eso son
# minutos de cuota que se agotan.
#
# ⚠️ Se agotaron de verdad: el 19 de agosto de 2026 la cuota del mes se acabó y
# GitHub empezó a cancelar TODAS las ejecuciones antes de arrancarlas. Los tres
# trabajos aparecían en rojo sin una sola línea de registro, que es un síntoma
# fácil de confundir con un fallo del código. No se facturó nada: el límite de
# gasto estaba en cero, así que Actions se detuvo en vez de cobrar.
#
# ⚠️ Se listan EXTENSIONES concretas, no `scripts/**` entero, porque ahí viven
# nueve archivos `.ts` --entre ellos `scripts/backup-db.ts`-- que sí son código
# del proyecto y sí los revisa el typecheck.
#
# Y se usa `paths-ignore` y no una lista positiva de `paths` a propósito: con
# una lista positiva, el día que se añada una carpeta nueva y se olvide
# apuntarla, sus cambios dejarían de pasar por CI sin que nada avise. Aquí el
# olvido se paga con una ejecución de más, no con una comprobación de menos.
#
# La lista va repetida en los dos disparadores a mano: GitHub Actions NO admite
# anclajes de YAML (`&nombre` / `*nombre`), aunque sean YAML válido. Al tocar
# una, tocar la otra.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "scripts/**.sh"
      - "scripts/**.json"
      - "scripts/**.yml"
      - "scripts/**.yaml"
      - "scripts/**.jq"
      - "scripts/**.ps1"
      - "scripts/mudanza/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "scripts/**.sh"
      - "scripts/**.json"
      - "scripts/**.yml"
      - "scripts/**.yaml"
      - "scripts/**.jq"
      - "scripts/**.ps1"
      - "scripts/mudanza/**"

# Permisos del token de la ejecucion, declarados AQUI y no solo en la
# organizacion.
#
# La organizacion ya los fija en READ, pero eso es un ajuste que alguien puede
# cambiar sin tocar este archivo, y que no viaja si el repositorio se copia a
# otra cuenta. Declarado aqui, el workflow se acota a si mismo pase lo que pase
# fuera.
#
# Leer el contenido es lo unico que necesita: clonar y comprobar. Ninguno de
# los tres trabajos escribe en el repositorio, publica paquetes ni comenta en
# un PR, asi que todo lo demas se queda en none.
permissions:
  contents: read

# Varios pushes seguidos ya no acumulan ejecuciones: la anterior se cancela y
# solo se comprueba el último commit, que es el que va a producción.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # ⚠️ pnpm por COREPACK, no por `pnpm/action-setup`. La organizacion solo
      # permite acciones propiedad de GitHub, y esa no lo es: con ella la CI ni
      # arrancaba --doce ejecuciones seguidas en `startup_failure`, sin una sola
      # linea de registro, que parece un fallo del codigo y no lo era--.
      #
      # Ademas es lo correcto: corepack lee `packageManager` de package.json,
      # que es la version que corre el servidor. Una sola fuente para la version
      # de pnpm, en vez de repetirla aqui y que un dia dejen de coincidir.
      - name: Activar pnpm por corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      # La cache del almacen se lleva a mano porque `cache: pnpm` de setup-node
      # exige que pnpm exista cuando esa accion corre, y aqui llega despues.
      - name: Ruta del almacen de pnpm
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache de dependencias
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: TypeScript typecheck
        run: pnpm exec tsc --noEmit

      - name: ESLint
        run: pnpm exec eslint . --max-warnings 0

      - name: Run tests
        run: pnpm test

  visual:
    name: Pantallas públicas
    runs-on: ubuntu-latest
    # BLOQUEA, y es fiable: son comprobaciones deterministas, no comparación de
    # píxeles. Verifican que los tokens de color produzcan colores válidos, que
    # los keyframes de los efectos lleguen al CSS servido, que el fondo animado
    # no capture toques y que las pantallas públicas rendericen sin excepciones.

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # ⚠️ pnpm por COREPACK, no por `pnpm/action-setup`. La organizacion solo
      # permite acciones propiedad de GitHub, y esa no lo es: con ella la CI ni
      # arrancaba --doce ejecuciones seguidas en `startup_failure`, sin una sola
      # linea de registro, que parece un fallo del codigo y no lo era--.
      #
      # Ademas es lo correcto: corepack lee `packageManager` de package.json,
      # que es la version que corre el servidor. Una sola fuente para la version
      # de pnpm, en vez de repetirla aqui y que un dia dejen de coincidir.
      - name: Activar pnpm por corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      # La cache del almacen se lleva a mano porque `cache: pnpm` de setup-node
      # exige que pnpm exista cuando esa accion corre, y aqui llega despues.
      - name: Ruta del almacen de pnpm
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache de dependencias
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        # Valores de relleno: ninguna de las pantallas bajo prueba consulta la
        # base de datos, pero lib/webauthn exige sus variables en un build de
        # producción y sin ellas el build falla en "Collecting page data".
        env:
          AUTH_SECRET: clave-de-ci-con-al-menos-32-caracteres
          DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/none
          WEBAUTHN_RP_ID: localhost
          WEBAUTHN_RP_NAME: Clarvex Team
          WEBAUTHN_ORIGIN: http://127.0.0.1:3100
        run: pnpm run build

      - name: Comprobaciones de pantallas públicas
        run: pnpm exec playwright test

      - name: Subir informe
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: informe-playwright
          path: playwright-report/
          retention-days: 14

  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # OSV-Scanner lee pnpm-lock.yaml y lo compara contra la base OSV (Google).
      # No depende del endpoint de auditoría de npm, que fue RETIRADO (respondía
      # 410 y rompía `pnpm audit` en cada push aunque no hubiera vulnerabilidades).
      # Falla el CI si encuentra una vulnerabilidad conocida. Para ignorar una
      # puntual y justificada (con fecha de revisión), usar un osv-scanner.toml.
      - name: OSV-Scanner (vulnerabilidades en dependencias)
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=pnpm-lock.yaml

  # ⚠️ Lo que el .gitignore NO puede cazar.
  #
  # Una llave privada puede llamarse cualquier cosa —`clarvex_vultr_2026` no
  # se parece a `id_rsa` ni acaba en `.key`— asi que ninguna lista de nombres
  # la detiene. Lo que si es invariable es su CONTENIDO: toda llave PEM abre
  # con «BEGIN ... PRIVATE KEY».
  #
  # Este trabajo existe porque el proyecto ya vivio el caso caro: un dump real
  # de PostgreSQL se colo en el historial y hubo que abrir un ticket con GitHub
  # Support para purgarlo, con la migracion de repositorio detenida mientras
  # tanto. Un fichero fuera del historial se borra; uno dentro, no.
  secretos:
    name: Sin secretos en el codigo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Hacen falta los dos lados para poder comparar en un PR.
          fetch-depth: 0

      # GitHub Secret Protection no esta disponible en repos privados del plan
      # Free. TruffleHog cubre ese hueco sin otra Action de terceros: se baja
      # una version fija, se comprueba su SHA-256 y se ejecuta localmente.
      # `--no-verification` impide mandar candidatos a AWS, Slack u otros
      # proveedores para comprobar si siguen activos.
      - name: Escanear secretos con TruffleHog
        env:
          TRUFFLEHOG_VERSION: "3.97.4"
          TRUFFLEHOG_SHA256: dc24007c2f233bd61c05beabeb44aa27ea9b43288166279209abe0458c5ce76b
        run: |
          set -euo pipefail

          ARCHIVO="$RUNNER_TEMP/trufflehog.tar.gz"
          BINARIO="$RUNNER_TEMP/trufflehog"
          URL="https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"

          curl -fsSL "$URL" -o "$ARCHIVO"
          echo "$TRUFFLEHOG_SHA256  $ARCHIVO" | sha256sum --check --strict
          tar -xzf "$ARCHIVO" -C "$RUNNER_TEMP" trufflehog

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.event.after }}"
          fi

          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=""
          fi

          "$BINARIO" git "file://$GITHUB_WORKSPACE" \
            --since-commit "$BASE" \
            --branch "$HEAD" \
            --fail \
            --no-update \
            --no-verification \
            --github-actions

      - name: Buscar llaves privadas y volcados
        run: |
          set -u

          # En un PR se revisa SOLO lo que anade; en push a main, el ultimo
          # commit. Revisar el arbol entero marcaria en rojo para siempre
          # cualquier cosa que ya estuviera dentro, y el trabajo se acabaria
          # ignorando.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGO="origin/${{ github.base_ref }}...HEAD"
          else
            RANGO="HEAD~1..HEAD"
          fi

          echo "Revisando $RANGO"

          # `git diff` con -G busca en las lineas ANADIDAS o quitadas.
          SOSPECHOSOS=$(git diff --name-only -G'BEGIN [A-Z ]*PRIVATE KEY' "$RANGO" || true)

          # Y los volcados, por si entran con un nombre que el ignore no cubre.
          VOLCADOS=$(git diff --name-only --diff-filter=A "$RANGO" \
            | grep -iE '\.(dump|pgdump|sqlite|sqlite3|db)$' || true)

          if [ -n "$SOSPECHOSOS" ] || [ -n "$VOLCADOS" ]; then
            echo "::error::Se detecto material que no puede entrar al historial."
            [ -n "$SOSPECHOSOS" ] && echo "Llaves privadas en: $SOSPECHOSOS"
            [ -n "$VOLCADOS" ] && echo "Volcados de base en: $VOLCADOS"
            echo ""
            echo "Un fichero fuera del historial se borra. Uno dentro, no:"
            echo "hay que reescribir el historial y pedir a GitHub que purgue"
            echo "sus referencias internas. Sacalo del commit antes de subirlo."
            exit 1
          fi

          echo "Limpio."
