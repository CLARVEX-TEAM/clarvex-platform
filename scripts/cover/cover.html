<style>
  @page { margin: 0; }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1280px; height: 440px; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0A0B0F;
    color: #F2F3F7;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 76px;
  }

  /* Rejilla de puntos, el mismo recurso que usa la app de fondo */
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.10) 1px, transparent 0);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(ellipse 80% 90% at 22% 50%, #000 20%, transparent 72%);
  }
  /* Halo del azul de marca */
  .glow {
    position: absolute; right: -140px; top: -180px;
    width: 760px; height: 760px; border-radius: 999px;
    background: radial-gradient(circle, rgba(37,99,235,.34), transparent 62%);
    filter: blur(50px);
  }
  /* Estela: guiño a los meteoritos del fondo real */
  .streak {
    position: absolute; width: 1.5px; height: 150px;
    background: linear-gradient(180deg, transparent, rgba(107,155,255,.85));
    transform: rotate(215deg);
  }
  .s1 { top: 40px; right: 320px; }
  .s2 { top: 120px; right: 190px; height: 96px; opacity: .55; }

  .inner { position: relative; display: flex; align-items: center; gap: 46px; }

  /* El logo real de la app, no un icono genérico. La ruta es relativa a este
     archivo, así que la portada se regenera sin depender de nada externo. */
  .mark {
    width: 132px; height: 132px; flex: none; border-radius: 34px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(37,99,235,.42);
  }
  .mark img { width: 100%; height: 100%; object-fit: cover; display: block; }

  h1 {
    font-size: 68px; font-weight: 800; letter-spacing: -.045em; line-height: 1;
  }
  .sub {
    margin-top: 16px; font-size: 22px; font-weight: 500; color: #A8AEC0;
    letter-spacing: -.012em; max-width: 30ch; line-height: 1.35;
  }
  .chips { margin-top: 26px; display: flex; gap: 9px; }
  .chip {
    font-size: 13.5px; font-weight: 650; color: #C7CDDC;
    border: 1px solid #262B39; background: #111420;
    padding: 7px 15px; border-radius: 999px;
  }
  .chip b { color: #6B9BFF; font-weight: 800; }
</style>

<div class="dots"></div>
<div class="glow"></div>
<div class="streak s1"></div>
<div class="streak s2"></div>

<div class="inner">
  <div class="mark">
    <img src="../../public/branding/entra/logo-240x240.png" alt="">
  </div>

  <div>
    <h1>Clarvex Team</h1>
    <p class="sub">La operación diaria de una tienda retail, en el teléfono del equipo.</p>
    <div class="chips">
      <span class="chip">Next.js <b>15.5</b></span>
      <span class="chip">PostgreSQL <b>16</b></span>
      <span class="chip">PWA <b>móvil primero</b></span>
    </div>
  </div>
</div>
