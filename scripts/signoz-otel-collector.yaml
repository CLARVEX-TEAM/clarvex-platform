# Colector de OpenTelemetry -> SigNoz Cloud.
#
# Copia versionada de /home/ubuntu/stack/otel-collector.yaml. El contenedor lo
# declara el compose del stack; esto es solo su configuracion.
#
# ⚠️ AQUI NO VA NINGUNA CLAVE. La de ingesta entra por `${SIGNOZ_INGESTION_KEY}`
# desde el .env del stack, igual que `SLACK_ALERT_WEBHOOK`. Este archivo se
# commitea al repositorio: una clave escrita aqui queda en GitHub para siempre,
# y rotarla no borra el historico.
#
# Por que un colector y no exportar directo desde la app:
#
#   - Las metricas de la MAQUINA y de los 10 contenedores no las puede mandar la
#     app: no las conoce.
#   - Los logs de cron son archivos en disco. Nadie mas los va a leer.
#   - Y la clave vive en un solo sitio, no repartida por cada proceso.

receivers:
  # Lo que manden la app y cualquier otro proceso del servidor.
  otlp:
    protocols:
      # ⚠️ 0.0.0.0 aqui NO es «abierto a internet», y ponerlo en 127.0.0.1 fue
      # un fallo que costo una vuelta: esto se ejecuta DENTRO del contenedor, y
      # Docker no entrega el puerto por su loopback sino por su interfaz de red.
      # Atado a 127.0.0.1 el colector escuchaba donde no llegaba nadie --el
      # `curl` de prueba devolvia 000-- y parecia que el contenedor estaba roto.
      #
      # Quien limita el alcance es el MAPEO del compose, `127.0.0.1:4318:4318`,
      # que solo lo publica en el loopback de la maquina. Dentro de la red de
      # Docker lo alcanzan los otros contenedores, que son todos nuestros.
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # La maquina: CPU, memoria, disco, red. Es lo que hoy solo se ve entrando por
  # ssh, y lo que avisaria de que el disco se esta llenando ANTES de que
  # Postgres deje de escribir --que es el fallo que de verdad para la tienda--.
  hostmetrics:
    collection_interval: 60s
    root_path: /hostfs
    scrapers:
      # ⚠️ `system.cpu.utilization` NO sale por omision: el scraper de CPU solo
      # emite `system.cpu.time`, que es un contador acumulado y no un
      # porcentaje. Sin activarla, cualquier panel de «CPU en %» sale vacio sin
      # decir por que.
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
      load:
      filesystem:
      network:
      paging:

  # Los 31 archivos de log de cron que hoy no mira nadie. Es la razon principal
  # por la que esto existe: tres crons fallaron 24 dias en silencio escribiendo
  # el error correcto en un archivo que nadie abre.
  #
  # ⚠️ Estos archivos NO tienen saltos de linea ni marcas de tiempo: son la
  # salida cruda de `curl`, un muro de JSON pegado. Tal cual, cada archivo
  # entero llega como UNA sola entrada gigante y no se puede filtrar por fecha
  # ni alertar sobre un fallo concreto. Hay que arreglar el wrapper
  # `cron-authenticated-post.sh` para que escriba una linea con hora por
  # ejecucion; hasta entonces esto sirve para ver QUE hay, no para vigilarlo.
  filelog:
    include: [/hostlogs/*.log]
    start_at: end
    include_file_name: true
    operators:
      # El nombre del archivo ES el nombre del cron. Sin esto, 31 archivos
      # distintos llegan indistinguibles y el panel no sirve para nada.
      - type: regex_parser
        parse_from: attributes["log.file.name"]
        regex: '^(?P<cron>.+)\.log$'
        on_error: send
      # ⚠️ Y el cuerpo se PARSEA como JSON, si lo es. Sin esto, `http`, `ok` y
      # `ms` viven dentro de una cadena y no se puede filtrar «dame los crons
      # que fallaron» -- que es justo la pregunta por la que esto existe. Con
      # `on_error: send` las lineas que no sean JSON --las de los dos crons que
      # no pasan por el wrapper-- entran igual, como texto.
      - type: json_parser
        parse_from: body
        on_error: send

  # El TRAFICO real: los logs de acceso del proxy. Traen metodo, estado, host,
  # ruta, bytes y agente de cada peticion que entra a team.clarvex.tech.
  #
  # ⚠️ SE REDACTA ANTES DE SALIR, y no es teorico: esta app pone tokens EN LA
  # URL --`/api/app/apk?t=...` para bajar el APK, `/v/<token>` para verificar
  # una credencial--. Mandarlos a un tercero seria entregar enlaces que por si
  # solos autorizan. Hoy no hay ninguno en la ventana retenida del log; da
  # igual, el dia que alguien actualice la APK lo habria.
  #
  # ⚠️ Y la IP del cliente se recorta a su red. Esta app maneja datos de
  # empleados y ya decidio `sendDefaultPii: false` para Sentry; mandar la IP
  # entera a otro SaaS contradiria esa decision sin que nadie la revisara. Con
  # la red se sigue viendo quien machaca el servidor --los sondeos buscando
  # `.env` y `.git/config` estan ahi ahora mismo-- sin senalar a una persona.
  filelog/proxy:
    include: [/hostproxy/proxy-host-*_access.log]
    start_at: end
    include_file_name: true
    operators:
      - type: regex_parser
        regex: '^\[(?P<cuando>[^\]]+)\] - (?P<estado>\d+) \d+ - (?P<metodo>\w+) (?P<esquema>\w+) (?P<host>\S+) "(?P<ruta_cruda>[^"]*)" \[Client (?P<ip_cruda>[^\]]+)\] \[Length (?P<bytes>\d+)\]'
        on_error: send
      # Fuera la query entera: ahi es donde viajan los tokens.
      - type: regex_parser
        parse_from: attributes.ruta_cruda
        regex: '^(?P<ruta>[^?]*)'
        on_error: send
      - type: remove
        field: attributes.ruta_cruda
        on_error: send
      # La IP, a su red.
      - type: regex_parser
        parse_from: attributes.ip_cruda
        regex: '^(?P<red>\d+\.\d+\.\d+)\.'
        on_error: send
      - type: remove
        field: attributes.ip_cruda
        on_error: send

processors:
  # ⚠️ Obligatorio, no una optimizacion. Sin agrupar, cada metrica sale en su
  # propia peticion HTTPS y una maquina de 3.7 GB con swap ya tocado se pone a
  # pagar un handshake TLS por dato.
  batch:
    timeout: 10s
    send_batch_size: 1024

  # ⚠️ Tope duro de memoria. El colector NO puede ser lo que tumbe la app: con
  # 2.2 GB disponibles y 930 MB de swap ya en uso, un colector que crece sin
  # freno se lleva por delante a Postgres o al build. Al pasarse, TIRA
  # telemetria --que es exactamente lo correcto: se pierde una metrica, no la
  # tienda--.
  memory_limiter:
    check_interval: 5s
    limit_mib: 200
    spike_limit_mib: 50

  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: [os]

exporters:
  otlp:
    # De la cuenta de SigNoz Cloud; cambia segun la region.
    endpoint: ${env:SIGNOZ_ENDPOINT}   # ingest.us2.signoz.cloud:443
    tls:
      insecure: false
    headers:
      signoz-ingestion-key: ${env:SIGNOZ_INGESTION_KEY}
    # Si SigNoz no contesta, se reintenta y se encola en MEMORIA, acotada. No en
    # disco: el disco va al 69 % y una cola sin tope ahi es como se llena.
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      queue_size: 200

  # Grafana Cloud, en PARALELO a SigNoz.
  #
  # ⚠️ Los dos a la vez a proposito y sin coste extra: asi se comparan las dos
  # interfaces con datos reales antes de apagar una, y el cambio no deja ni un
  # minuto sin vigilancia. Un exportador que falle NO afecta al otro: cada uno
  # tiene su cola y sus reintentos.
  otlphttp/grafana:
    endpoint: ${env:GRAFANA_OTLP_ENDPOINT}
    headers:
      # `Basic <base64 de instanciaID:token>`, tal como lo arma Grafana. Sale
      # del .env; aqui no hay ninguna credencial porque esto se commitea.
      Authorization: ${env:GRAFANA_OTLP_AUTH}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      queue_size: 200

service:
  # ⚠️ El propio colector escribe a su log de Docker, no a SigNoz: si se lo
  # mandara a si mismo, un fallo de envio generaria un log que tampoco se puede
  # enviar. Se mira con `docker logs otel-collector`.
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp, otlphttp/grafana]
    metrics:
      receivers: [otlp, hostmetrics]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp, otlphttp/grafana]
    logs:
      receivers: [otlp, filelog, filelog/proxy]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp, otlphttp/grafana]
