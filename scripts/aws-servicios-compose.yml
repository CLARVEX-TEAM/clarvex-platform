# Los cuatro servicios que faltaban en AWS, replicando Vultr.
#
# NO incluye postgres ni npm: en AWS esos dos ya corren, creados con `docker
# run` sueltos y con su propia configuracion. Meterlos aqui los recrearia y se
# perderia lo que ya sirve team.clarvex.tech.
#
# ⚠️ RED COMPARTIDA. En Vultr, npm alcanza a uptime-kuma, vaultwarden y
# portainer POR NOMBRE de contenedor, porque comparten la red de compose. En
# AWS los contenedores existentes estan en el bridge por omision, que NO
# resuelve nombres. Por eso esto crea `clarvex_net` y npm hay que conectarlo:
#
#   sudo docker network connect clarvex_net npm
#
# Sin ese paso, los tres proxys responden 502 y el sintoma no dice por que.
#
# Los nombres de contenedor tienen que coincidir EXACTAMENTE con los de Vultr:
# son los que npm usa como destino.

name: clarvex

services:
  n8n:
    image: n8nio/n8n:2.30.4
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n.adrianluna.mx
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.adrianluna.mx/
      - N8N_SECURE_COOKIE=false
      # Llave de Groq para transcribir las notas de voz del buzon personal.
      # El VALOR vive en /home/ubuntu/stack/.env (chmod 600), no aqui: este
      # archivo se versiona en el repo como scripts/aws-servicios-compose.yml.
      - GROQ_API_KEY=${GROQ_API_KEY}
      # Sin esto las expresiones de n8n no pueden leer $env y la llave no llega
      # al nodo. n8n lo bloquea por omision en produccion.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # ⚠️ n8n 2.x restringe POR OMISION donde pueden escribir los nodos, a
      # `~/.n8n-files`. Sin esta linea el nodo de guardar falla con "is not
      # writable" aunque los permisos del sistema esten bien: la carpeta se
      # puede escribir desde la shell del contenedor y el nodo aun asi la
      # rechaza, porque el bloqueo es de n8n, no del sistema de archivos.
      #
      # Apuntarlo a /buzon deja la app MAS acotada que por omision: es el
      # unico sitio del disco que los nodos pueden tocar.
      # Varias rutas se separan con `;`. /gastos es aparte de /buzon a
      # proposito: el buzon es de PASO --se vacia cada cinco minutos desde la
      # PC-- y el libro de gastos tiene que quedarse quieto en algun sitio.
      - N8N_RESTRICT_FILE_ACCESS_TO=/buzon;/gastos;/visual
      # Secreto de la API de captura de Clarvex, para el pase de lista desde
      # el bot. El VALOR vive en /home/ubuntu/stack/.env, no aqui.
      - ADMIN_CAPTURE_SECRET=${ADMIN_CAPTURE_SECRET}
      # Alertas tecnicas a Slack. El valor vive en /home/ubuntu/stack/.env; aqui
      # solo se pasa al contenedor, para que no quede escrito en el repositorio.
      - SLACK_ALERT_WEBHOOK=${SLACK_ALERT_WEBHOOK}
    volumes:
      - ./n8n_data:/home/node/.n8n
      # La carpeta del buzon, compartida con syncthing. Los dos contenedores
      # corren con uid 1000, asi que lo que escribe n8n lo lee syncthing.
      - /home/ubuntu/buzon:/buzon
      # El libro de gastos y sus comprobantes. Carpeta PERMANENTE, con su propia
      # carpeta de Syncthing, para que nada de aqui se lo lleve el movedor.
      - /home/ubuntu/gastos:/gastos
      # Fotos del reporte fotografico semanal. Las deja el bot y las recoge
      # Clarvex desde el disco del anfitrion, sin pasarlas por HTTP.
      - /home/ubuntu/visual:/visual
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks: [clarvex_net]

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    dns: ["1.1.1.1", "8.8.8.8"]
    volumes:
      - ./uptime-kuma:/app/data
    # Solo en localhost: quien lo sirve al exterior es `tailscale serve`,
    # no el proxy. Sin el 127.0.0.1 quedaria escuchando en toda la red.
    ports:
      - "127.0.0.1:3001:3001"
    networks: [clarvex_net]

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    volumes:
      - ./vaultwarden:/data
    ports:
      - "127.0.0.1:8080:80"
    networks: [clarvex_net]

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer:/data
    ports:
      - "127.0.0.1:9000:9000"
    networks: [clarvex_net]

  # Pantalla de mudanza para el dominio viejo (app.adrianluna.mx).
  #
  # Es un contenedor APARTE y no la app: si el dominio viejo sirviera Clarvex,
  # el navegador rechazaria las huellas por venir de otro origen —la app tiene
  # WEBAUTHN_ORIGIN en team.clarvex.tech— y el fallo no explicaria por que.
  # Aqui solo hay un HTML de 8 KB, sin peticiones externas.
  syncthing:
    image: syncthing/syncthing:1
    container_name: syncthing
    restart: unless-stopped
    hostname: clarvex-aws
    environment:
      - PUID=1000
      - PGID=1000
      - STGUIADDRESS=0.0.0.0:8384
    ports:
      - "100.64.207.65:8384:8384"
      - "100.64.207.65:22000:22000/tcp"
      - "100.64.207.65:22000:22000/udp"
    volumes:
      - ./syncthing:/var/syncthing/config
      - /home/ubuntu/buzon:/var/syncthing/Buzon
      - /home/ubuntu/gastos:/var/syncthing/Gastos
      - /home/ubuntu/documentos:/var/syncthing/Documentos
      - /home/ubuntu/respaldos:/var/syncthing/Respaldos
      - /home/ubuntu/compartido:/var/syncthing/Compartido
    networks: [clarvex_net]

  # WebDAV: ver y SUBIR a Documentos y Respaldos desde el telefono (Cx File
  # Explorer), sin que los archivos vivan en el telefono. Lo que se sube cae
  # aqui y Syncthing lo baja a la carpeta Nube de la PC.
  #
  # Igual que Adminer: el puerto se publica en 127.0.0.1 A PROPOSITO y se entra
  # por `tailscale serve` (https://clarvex-aws.taile59f37.ts.net:11443), que pone
  # TLS y solo responde dentro del tailnet. Publicarlo en 0.0.0.0 lo dejaria en
  # la IP publica con los archivos personales detras.
  #
  # Corre como 1000:1000 porque es el usuario de Syncthing: con otro, lo subido
  # quedaria con un dueno que Syncthing no puede leer y no se sincronizaria.
  #
  # Sin red compartida: no necesita hablar con nadie, y asi no alcanza la base.
  webdav:
    image: rclone/rclone:1.75.1
    container_name: webdav
    restart: unless-stopped
    user: "1000:1000"
    command: ["serve", "webdav", "/data", "--addr", ":8080", "--htpasswd", "/auth/htpasswd"]
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - /home/ubuntu/documentos:/data/Documentos
      - /home/ubuntu/respaldos:/data/Respaldos
      - /home/ubuntu/compartido:/data/Compartido
      - ./webdav.htpasswd:/auth/htpasswd:ro

  # Adminer: mirar la base de datos desde el navegador, SOLO por Tailscale.
  #
  # Se elige Adminer y no pgAdmin porque la RAM aqui es escasa (3.7 GB con la
  # app en cluster, Postgres y ocho contenedores): esto son ~15 MB, pgAdmin
  # ronda los 300.
  #
  # El puerto se publica en 127.0.0.1 A PROPOSITO. Quien entra lo hace por
  # `tailscale serve`, que ya pone TLS y solo responde dentro del tailnet.
  # Publicarlo en 0.0.0.0 lo dejaria escuchando tambien en la IP publica, y el
  # grupo de seguridad seria lo unico que separa la base de internet.
  adminer:
    image: adminer:4-standalone
    container_name: adminer
    restart: unless-stopped
    environment:
      # Rellena el host al abrir; el usuario y la contrasena se teclean.
      - ADMINER_DEFAULT_SERVER=clarvex_postgres
      - ADMINER_DESIGN=dracula
    ports:
      - "127.0.0.1:8082:8080"
    networks: [clarvex_net]

  # Colector de OpenTelemetry -> SigNoz Cloud (region us2).
  #
  # Su configuracion vive aparte, en otel-collector.yaml, con copia versionada
  # en el repositorio como scripts/signoz-otel-collector.yaml.
  #
  # La clave NO esta aqui: sale del .env, igual que SLACK_ALERT_WEBHOOK. Este
  # archivo se commitea.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    environment:
      - SIGNOZ_ENDPOINT
      - SIGNOZ_INGESTION_KEY
      - GRAFANA_OTLP_ENDPOINT
      - GRAFANA_OTLP_AUTH
      - POSTGRES_MONITOR_PASS
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
      # Solo LECTURA y solo lo que hace falta: las metricas de la maquina y los
      # logs de cron. El colector no tiene por que ver nada mas del disco.
      - /:/hostfs:ro
      - /home/ubuntu/logs:/hostlogs:ro
      # El trafico: los logs de acceso del proxy. Solo lectura.
      - /home/ubuntu/stack/npm/data/logs:/hostproxy:ro
      # Los logs de la app que escribe PM2.
      - /home/ubuntu/.pm2/logs:/hostpm2:ro
    # ⚠️ Tope de memoria a nivel de Docker, ADEMAS del memory_limiter de su
    # configuracion. El de dentro decide que telemetria tira; este garantiza
    # que pase lo que pase no se lleve por delante a Postgres ni al build, que
    # en una maquina de 3.7 GB con swap tocado es el riesgo real.
    mem_limit: 300m
    ports:
      # ⚠️ Solo loopback: quien manda telemetria es la app, en esta maquina.
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    networks: [clarvex_net]

networks:
  clarvex_net:
    name: clarvex_net
